[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "5.2.0"
edition = "2024"
rust-version = "1.90.0"
authors = ["Amos Wenger <amos@bearcove.eu>", "TeamDman <TeamDman9201@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TeamDman/figue"
homepage = "https://github.com/TeamDman/figue"
keywords = ["cli", "args", "parser", "facet", "command-line"]
categories = ["command-line-interface"]

[workspace.metadata.teamy]
upstream_figue = "4.0.3"

[workspace.dependencies]
figue-attrs = { path = "crates/figue-attrs", package = "teamy-figue-attrs", version = "=5.2.0" }

# Facet ecosystem. This is a temporary coherent monorepo integration ref used
# to test the reflected Cow ownership feature across downstream consumers.
facet = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154", features = ["indexmap", "camino", "net"] }
facet-core = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-format = { path = "crates/facet-format", package = "teamy-facet-format", version = "=0.47.1-teamy.1" }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-reflect = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-error = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-solver = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }
facet-testhelpers = { git = "https://github.com/TeamDman/facet.git", rev = "2fa5a53d4a0b95e359fdf0c8e34adfdb5d499154" }

# External dependencies
camino = "1.1"
heck = "0.5.0"
indexmap = "2"
owo-colors = "4"
tracing = "0.1"
ariadne = "0.6"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
strsim = "0.11"
insta = "1"
supports-color = "3"
tempfile = "3"
arbitrary = "1.4.2"
rand = "0.9.2"
rand_chacha = "0.9.0"

# Uncomment for local development with facet
# [patch."https://github.com/facet-rs/facet"]
# facet = { path = "../facet/facet" }
# facet-core = { path = "../facet/facet-core" }
