[package]
name = "teamy-figue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Amos Wenger <amos@bearcove.eu>", "TeamDman <TeamDman9201@gmail.com>"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cli", "args", "parser", "facet", "command-line"]
categories = ["command-line-interface"]
description = "TeamDman fork of Figue: typed CLI arguments, config files, and environment variables using the Teamy Facet fork"
documentation = "https://docs.rs/teamy-figue"
readme = "README.md"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "figue"

[dependencies]
camino.workspace = true
figue-attrs.workspace = true
facet = { workspace = true, features = ["camino", "indexmap"] }
facet-core.workspace = true
facet-format.workspace = true
facet-json.workspace = true
facet-reflect.workspace = true
facet-pretty.workspace = true
facet-error.workspace = true
heck.workspace = true
indexmap = { workspace = true, features = ["std"] }
owo-colors.workspace = true
tracing.workspace = true
ariadne.workspace = true
unicode-width.workspace = true
strip-ansi-escapes.workspace = true
strsim.workspace = true
supports-color.workspace = true
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
rand = { version = "0.9.2", optional = true }
rand_chacha = { version = "0.9.0", optional = true }

[dev-dependencies]
# Source-tree checks use sibling forks. Path-only dev dependencies are omitted
# from registry archives so first publication does not require test-only crates.
facet-format = { package = "teamy-facet-format", path = "../../facet-format/facet-format", features = ["tracing"] }
facet-default = { package = "teamy-facet-default", path = "../../facet/facet-default" }
facet-json = { package = "teamy-facet-json", path = "../../facet-format/facet-json", features = ["tracing"] }
facet-reflect = { package = "teamy-facet-reflect", path = "../../facet/facet-reflect", features = ["tracing"] }
facet = { package = "teamy-facet", path = "../../facet/facet", features = ["all-impls"] }
facet-solver = { package = "teamy-facet-solver", path = "../../facet/facet-solver" }
facet-testhelpers = { package = "teamy-facet-testhelpers", path = "../../facet/facet-testhelpers" }
insta.workspace = true
tempfile.workspace = true

[features]
default = ["rich-diagnostics"]
rich-diagnostics = []
doc = ["facet/doc"]
tracing = ["facet-reflect/tracing", "facet-json/tracing", "facet-format/tracing"]
arbitrary = ["dep:arbitrary", "dep:rand", "dep:rand_chacha"]

[lints]
workspace = true
